query GetRotationProviderResources(
  $providerId: String!
  $authenticationId: ID!
  $resourceType: String!
  $config: GenericScalar
) {
  rotationProviderResources(
    providerId: $providerId
    authenticationId: $authenticationId
    resourceType: $resourceType
    config: $config
  ) {
    id
    name
    description
  }
}
