query GetServiceAccountTokenContext($orgId: ID!, $id: ID) {
  serviceAccounts(orgId: $orgId, serviceAccountId: $id) {
    id
    serverSideKeyManagementEnabled
    handlers {
      id
      wrappedKeyring
      user {
        id
        self
      }
    }
    team {
      id
      owner {
        id
      }
      members {
        id
        orgMember {
          id
        }
      }
      memberRole {
        id
        permissions
      }
    }
  }
}
