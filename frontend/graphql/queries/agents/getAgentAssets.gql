query GetAgentAssets(
  $organisationId: ID!
  $includeConnections: Boolean! = false
  $includeServiceTemplates: Boolean! = false
) {
  agentConnections(organisationId: $organisationId) @include(if: $includeConnections) {
    id
    name
    serviceType
    state
    takesPolicy
    policy
    managedPolicies
    authentication {
      id
      name
      provider {
        id
        name
      }
    }
    config
    definition
    app {
      id
      name
      sseEnabled
    }
    environments {
      id
      name
      envType
    }
    encryptionPublicKey
    valueRevision
    valueUpdatedAt
    valueUpdatedBy {
      id
      fullName
      email
    }
    updatedAt
    hostRulesAuthoredBy {
      id
    }
    hostRulesApprovedBy {
      id
    }
    hostRulesVersion
    hostRulesApprovedVersion
  }
  agentServiceTemplates(organisationId: $organisationId) @include(if: $includeServiceTemplates) {
    serviceType
    displayName
    protocol
    provider
    hostRulesMode
  }
}
