query GetAgentAssets(
  $organisationId: ID!
  $includeConnections: Boolean! = false
  $includeServiceTemplates: Boolean! = false
) {
  agentConnections(organisationId: $organisationId) @include(if: $includeConnections) {
    id
    name
    serviceType
    state
    authentication {
      id
      name
      revision
      provider {
        id
        name
      }
    }
    config
    injection
    createdAt
    updatedAt
    hostRulesAuthoredBy {
      id
      username
    }
    hostRulesApprovedBy {
      id
      username
    }
    hostRulesVersion
    hostRulesApprovedVersion
  }
  agentServiceTemplates(organisationId: $organisationId) @include(if: $includeServiceTemplates) {
    serviceType
    displayName
    protocol
    provider
    proxyOnly
    hosts
    hostRulesMode
    configSchema
    injection
    fields
    environmentBindings
    decoyFormat
    credentialProviders
  }
}
