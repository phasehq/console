fragment AgentRequestFields on AgentRequestType {
  id
  kind
  title
  progress
  revision
  serviceType
  credentialProvider
  credentialName
  markdown
  status
  resolutionNote
  expiresAt
  resolvedAt
  createdAt
  action
  appliedAction
  approval
  actionReview
  agent {
    id
    name
    harnessType
  }
  workflow {
    id
    name
  }
  connection {
    id
    name
    serviceType
    definition
    encryptionPublicKey
    authentication {
      id
      name
      revision
      provider {
        id
        name
      }
    }
  }
  credential {
    id
    name
    revision
    provider {
      id
      name
    }
  }
}

query GetAgentRequests($organisationId: ID!, $status: String, $requestId: ID, $limit: Int) {
  agentRequests(
    organisationId: $organisationId
    status: $status
    requestId: $requestId
    limit: $limit
  ) {
    ...AgentRequestFields
  }
}
