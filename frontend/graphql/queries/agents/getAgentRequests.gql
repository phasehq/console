query GetAgentRequests($organisationId: ID!, $status: String, $requestId: ID, $limit: Int) {
  agentRequests(
    organisationId: $organisationId
    status: $status
    requestId: $requestId
    limit: $limit
  ) {
    id
    kind
    progress
    revision
    serviceType
    credentialProvider
    credentialName
    markdown
    status
    resolutionNote
    expiresAt
    resolvedAt
    createdAt
    agent {
      id
      name
      harnessType
    }
    workflow {
      id
      name
    }
    connection {
      id
      name
      authentication {
        id
        name
        revision
        provider {
          id
          name
        }
      }
    }
    credential {
      id
      name
      revision
      provider {
        id
        name
      }
    }
  }
}
