query GetOrganisationPlan($organisationId: ID!) {
  organisationPlan(organisationId: $organisationId) {
    name
    maxUsers
    maxApps
    maxEnvsPerApp
    maxAgents
    maxWorkflowsPerAgent
    seatsUsed {
      users
      serviceAccounts
      total
    }
    seatLimit
    appCount
    agentCount
  }
}
