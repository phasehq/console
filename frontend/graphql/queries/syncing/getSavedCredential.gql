query GetSavedCredential($credentialId: ID!) {
  providerCredential(credentialId: $credentialId) {
    id
    name
    revision
    credentials
    sealedCredentials
    provider {
      id
      name
      expectedCredentials
      optionalCredentials
      nonSensitiveCredentials
      endpointCredentials
    }
    syncCount
    agentConnectionCount
  }
}
