mutation CreateSAToken(
  $serviceAccountId: ID!
  $name: String!
  $identityKey: String!
  $token: String!
  $wrappedKeyShare: String!
  $expiry: BigInt
  $signature: String!
) {
  createServiceAccountToken(
    serviceAccountId: $serviceAccountId
    name: $name
    identityKey: $identityKey
    token: $token
    wrappedKeyShare: $wrappedKeyShare
    expiry: $expiry
    signature: $signature
  ) {
    token {
      id
    }
  }
}
