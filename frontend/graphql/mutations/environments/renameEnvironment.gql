mutation RenameEnv($environmentId: ID!, $name: String!, $color: String, $isPrimary: Boolean) {
  renameEnvironment(
    environmentId: $environmentId
    name: $name
    color: $color
    isPrimary: $isPrimary
  ) {
    environment {
      id
      name
      color
      isPrimary
      updatedAt
    }
  }
}
