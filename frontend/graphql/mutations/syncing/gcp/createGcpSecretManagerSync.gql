mutation CreateNewGcpSecretManagerSync(
  $envId: ID!
  $path: String!
  $credentialId: ID!
  $projectId: String!
  $location: String!
  $syncMode: String!
  $secretName: String
  $prefix: String
  $kmsKeyName: String
) {
  createGcpSecretManagerSync(
    envId: $envId
    path: $path
    credentialId: $credentialId
    projectId: $projectId
    location: $location
    syncMode: $syncMode
    secretName: $secretName
    prefix: $prefix
    kmsKeyName: $kmsKeyName
  ) {
    sync {
      id
      environment {
        id
        name
        envType
      }
      serviceInfo {
        name
      }
      isActive
      lastSync
      createdAt
    }
  }
}
