mutation CreateNewGitlabCiSync($envId: ID!, $path: String!, $credentialId: ID! $resourcePath: String!, $resourceId: String!, $isGroup: Boolean!, $isMasked: Boolean!, $isProtected: Boolean!, $environmentScope: String ) {
  createGitlabCiSync(envId: $envId, path: $path, credentialId: $credentialId, resourcePath: $resourcePath, resourceId: $resourceId, isGroup: $isGroup, masked: $isMasked, protected: $isProtected, environmentScope: $environmentScope) {
    sync {
      id
      environment {
        id
        name
        envType
      }
      serviceInfo {
        id
        name
      }
      isActive
      lastSync
      createdAt
    }
  }
}
