mutation UpdateProviderCreds(
  $credentialId: ID!
  $expectedRevision: String!
  $name: String!
  $credentials: JSONString!
) {
  updateProviderCredentials(
    credentialId: $credentialId
    expectedRevision: $expectedRevision
    name: $name
    credentials: $credentials
  ) {
    credential {
      id
      revision
    }
  }
}
